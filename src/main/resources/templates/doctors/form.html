<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('Лекар')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 th:text="${doctor.id == null} ? 'Нов лекар' : 'Редакция на лекар'"></h5>
                </div>
                <div class="card-body">
                    <form th:action="${doctor.id == null} ? @{/doctors/new} : @{/doctors/{id}/edit(id=${doctor.id})}"
                          th:object="${doctor}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Идентификационен номер *</label>
                            <input type="text" class="form-control" th:field="*{identificationNumber}"
                                   th:classappend="${#fields.hasErrors('identificationNumber')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{identificationNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Име *</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Специалност *</label>
                            <input type="text" class="form-control" th:field="*{speciality}"
                                   th:classappend="${#fields.hasErrors('speciality')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{speciality}"></div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{generalPractitioner}"/>
                            <label class="form-check-label">Общопрактикуващ лекар</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Запази</button>
                        <a th:href="@{/doctors}" class="btn btn-secondary ms-2">Отказ</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
