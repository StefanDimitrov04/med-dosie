<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{_layout :: head('Болнични листове')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Болнични листове</h2>
        <a sec:authorize="hasAnyRole('DOCTOR','ADMIN')" th:href="@{/sick-leaves/new}" class="btn btn-success">+ Нов болничен</a>
    </div>
    <table class="table table-striped table-hover">
        <thead class="table-primary">
        <tr>
            <th>#</th>
            <th>От дата</th>
            <th>Дни</th>
            <th>Пациент</th>
            <th>Лекар</th>
            <th sec:authorize="hasAnyRole('DOCTOR','ADMIN')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sl : ${sickLeaves}">
            <td th:text="${sl.id}"></td>
            <td th:text="${sl.startDate}"></td>
            <td th:text="${sl.durationDays}"></td>
            <td th:text="${sl.patientName}"></td>
            <td th:text="${sl.doctorName}"></td>
            <td sec:authorize="hasAnyRole('DOCTOR','ADMIN')">
                <a th:href="@{/sick-leaves/{id}(id=${sl.id})}" class="btn btn-sm btn-info">Детайли</a>
                <a th:href="@{/sick-leaves/{id}/edit(id=${sl.id})}" class="btn btn-sm btn-warning">Редакция</a>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{/sick-leaves/{id}/delete(id=${sl.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Изтриване на болничен?')">
                    <button class="btn btn-sm btn-danger" type="submit">Изтрий</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(sickLeaves)}">
            <td colspan="6" class="text-center text-muted">Няма болнични листове.</td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
