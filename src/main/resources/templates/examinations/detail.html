<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{_layout :: head('Examination Details')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Examination #<span th:text="${examination.id}"></span></h4>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4">Date</dt>
                <dd class="col-sm-8" th:text="${examination.date}"></dd>
                <dt class="col-sm-4">Doctor</dt>
                <dd class="col-sm-8" th:text="${examination.doctorName}"></dd>
                <dt class="col-sm-4">Patient</dt>
                <dd class="col-sm-8" th:text="${examination.patientName}"></dd>
                <dt class="col-sm-4">Diagnoses</dt>
                <dd class="col-sm-8">
                    <span th:each="d, stat : ${examination.diagnoses}"
                          class="badge bg-secondary me-1"
                          th:text="${d.name}"></span>
                </dd>
                <dt class="col-sm-4">Treatment</dt>
                <dd class="col-sm-8" th:text="${examination.treatment}"></dd>
                <dt class="col-sm-4">Price</dt>
                <dd class="col-sm-8" th:text="${examination.price} + ' EUR'"></dd>
            </dl>
        </div>
        <div class="card-footer">
            <a th:href="@{/examinations}" class="btn btn-secondary">Back</a>
            <a sec:authorize="hasAnyRole('DOCTOR','ADMIN')"
               th:href="@{/examinations/{id}/edit(id=${examination.id})}" class="btn btn-warning">Edit</a>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
