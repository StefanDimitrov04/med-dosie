<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{_layout :: head('Прегледи')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Прегледи</h2>
        <a sec:authorize="hasAnyRole('DOCTOR','ADMIN')" th:href="@{/examinations/new}" class="btn btn-success">+ Нов преглед</a>
    </div>
    <table class="table table-striped table-hover">
        <thead class="table-primary">
        <tr>
            <th>#</th>
            <th>Дата</th>
            <th>Лекар</th>
            <th>Пациент</th>
            <th>Лечение</th>
            <th>Цена</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${examinations}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.date}"></td>
            <td th:text="${e.doctorName}"></td>
            <td th:text="${e.patientName}"></td>
            <td th:text="${e.treatment}"></td>
            <td th:text="${e.price}"></td>
            <td>
                <a th:href="@{/examinations/{id}(id=${e.id})}" class="btn btn-sm btn-info">Детайли</a>
                <a sec:authorize="hasAnyRole('DOCTOR','ADMIN')"
                   th:href="@{/examinations/{id}/edit(id=${e.id})}" class="btn btn-sm btn-warning">Редакция</a>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{/examinations/{id}/delete(id=${e.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Изтриване на преглед?')">
                    <button class="btn btn-sm btn-danger" type="submit">Изтрий</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(examinations)}">
            <td colspan="7" class="text-center text-muted">Няма прегледи.</td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
