<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('Patient')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 th:text="${patient.id == null} ? 'New Patient' : 'Edit Patient'"></h5>
                </div>
                <div class="card-body">
                    <form th:action="${patient.id == null} ? @{/patients/new} : @{/patients/{id}/edit(id=${patient.id})}"
                          th:object="${patient}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Name *</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Personal ID (EGN) * — 10 digits</label>
                            <input type="text" class="form-control" th:field="*{egn}"
                                   th:classappend="${#fields.hasErrors('egn')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{egn}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">General Practitioner *</label>
                            <select class="form-select" th:field="*{generalPractitionerId}"
                                    th:classappend="${#fields.hasErrors('generalPractitionerId')} ? 'is-invalid'">
                                <option value="">-- Select --</option>
                                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{generalPractitionerId}"></div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{healthInsured}"/>
                            <label class="form-check-label">Health Insured</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/patients}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
