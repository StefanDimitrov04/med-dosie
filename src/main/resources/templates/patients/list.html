<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{_layout :: head('Пациенти')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Пациенти</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/patients/new}" class="btn btn-success">+ Добави пациент</a>
    </div>
    <table class="table table-striped table-hover">
        <thead class="table-primary">
        <tr>
            <th>#</th>
            <th>Име</th>
            <th>ЕГН</th>
            <th>ОПЛ</th>
            <th>Здравноосигурен</th>
            <th sec:authorize="hasRole('ADMIN')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.id}"></td>
            <td><a th:href="@{/patients/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
            <td th:text="${p.egn}"></td>
            <td th:text="${p.generalPractitionerName}"></td>
            <td th:text="${p.healthInsured} ? 'Да' : 'Не'"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/patients/{id}/edit(id=${p.id})}" class="btn btn-sm btn-warning">Редакция</a>
                <form th:action="@{/patients/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Изтриване на пациент?')">
                    <button class="btn btn-sm btn-danger" type="submit">Изтрий</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(patients)}">
            <td colspan="6" class="text-center text-muted">Няма пациенти.</td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
