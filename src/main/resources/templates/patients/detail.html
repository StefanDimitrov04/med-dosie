<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{_layout :: head('Patient Details')}"></head>
<body>
<nav th:replace="~{_layout :: navbar}"></nav>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${patient.name}"></h4>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4">Personal ID (EGN)</dt>
                <dd class="col-sm-8" th:text="${patient.egn}"></dd>
                <dt class="col-sm-4">General Practitioner</dt>
                <dd class="col-sm-8" th:text="${patient.generalPractitionerName}"></dd>
                <dt class="col-sm-4">Health Insured</dt>
                <dd class="col-sm-8" th:text="${patient.healthInsured} ? 'Yes' : 'No'"></dd>
            </dl>
        </div>
        <div class="card-footer">
            <a th:href="@{/patients}" class="btn btn-secondary">Back</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-warning">Edit</a>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
